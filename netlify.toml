# ============================================================
# BryanOS — Netlify Deployment Config
# Next.js frontend + Express API as Netlify Function
# ============================================================

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = ".next"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"
  included_files = ["../services/**", "../server.js", "../routes/**", "../middleware/**"]

# Next.js on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# API routes → Netlify Function (Express backend)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true
